<!doctype html>
<html lang="es-MX">
    <head>
        <script>
            document.documentElement.setAttribute(
                "data-theme",
                localStorage.getItem("tema") || "dark"
            );
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Bitácora · Acceso</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="/static/css/tokens.css" />
        <link rel="stylesheet" href="/static/css/utilidades.css" />
        <link rel="stylesheet" href="/static/css/componentes.css" />
        <link rel="stylesheet" href="/static/css/login.css" />

        <script defer src="/static/js/login.js"></script>
        <script defer src="/static/js/tema.js"></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
        ></script>
    </head>

    <body>
        <button
            type="button"
            class="boton-tema"
            id="boton-tema"
            aria-label="Cambiar tema"
        >
            <svg
                class="boton-tema__icono boton-tema__icono--sol"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
            >
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
            </svg>
            <svg
                class="boton-tema__icono boton-tema__icono--luna"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
            >
                <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
            </svg>
        </button>

        <div class="escena" x-data="loginApp()">
            <div class="pestana">Supervisión de Cobranza Extrajudicial</div>

            <main class="ficha">
                <div class="marca">
                    <h1 class="marca__nombre u-titulo u-texto-primario">
                        Bitácora
                    </h1>
                </div>

                <p
                    class="subtitulo u-subtitulo u-texto-terciario"
                    x-text="subtitulos[vista]"
                ></p>

                <!-- LOGIN -->

                <form
                    x-show="vista === 'login'"
                    x-cloak
                    @submit.prevent="enviarLogin"
                    novalidate
                >
                    <div class="campo">
                        <label
                            for="correo"
                            class="u-etiqueta u-texto-terciario"
                        >
                            Correo
                        </label>

                        <input
                            id="correo"
                            type="email"
                            x-model="correo"
                            placeholder="nombre@mgc.com.mx"
                            autocomplete="username"
                            :disabled="cargando"
                            autofocus
                            required
                        />
                    </div>

                    <div class="campo">
                        <label
                            for="password"
                            class="u-etiqueta u-texto-terciario"
                        >
                            Contraseña
                        </label>

                        <div class="campo__envoltura">
                            <input
                                id="password"
                                :type="mostrarPassword ? 'text' : 'password'"
                                x-model="password"
                                placeholder="••••••••"
                                autocomplete="current-password"
                                :disabled="cargando"
                                required
                            />

                            <button
                                type="button"
                                class="campo__alternar"
                                tabindex="-1"
                                @click="mostrarPassword = !mostrarPassword"
                                :aria-label="
                            mostrarPassword
                                ? 'Ocultar contraseña'
                                : 'Mostrar contraseña'
                        "
                            >
                                <svg
                                    x-show="!mostrarPassword"
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                >
                                    <path
                                        d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"
                                    />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>

                                <svg
                                    x-show="mostrarPassword"
                                    x-cloak
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                >
                                    <path d="M3 3l18 18" />
                                    <path
                                        d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a13.6 13.6 0 0 1-3.4 4M6.3 6.3C3.4 8.1 1 12 1 12s4 7 11 7a10.8 10.8 0 0 0 4.2-.8"
                                    />
                                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                                </svg>
                            </button>
                        </div>

                        <div class="campo__enlace">
                            <button
                                type="button"
                                class="enlace"
                                @click="irASolicitarCodigo"
                            >
                                ¿Olvidaste tu contraseña?
                            </button>
                        </div>
                    </div>

                    <button
                        class="boton u-boton-texto"
                        type="submit"
                        :disabled="cargando"
                    >
                        <span
                            class="boton__spinner"
                            x-show="cargando"
                            x-cloak
                        ></span>

                        <span
                            x-text="
                        cargando
                            ? 'Verificando'
                            : 'Iniciar sesión'
                    "
                        ></span>
                    </button>

                    <div
                        class="mensaje-error"
                        role="alert"
                        aria-live="polite"
                        x-show="error"
                        x-cloak
                    >
                        <span class="mensaje-error__sello"> Rechazado </span>

                        <span x-text="error"></span>
                    </div>
                </form>

                <!-- SOLICITAR CÓDIGO -->

                <form
                    x-show="vista === 'solicitar'"
                    x-cloak
                    @submit.prevent="solicitarCodigo"
                    novalidate
                >
                    <div class="campo">
                        <label
                            for="correo-recuperacion"
                            class="u-etiqueta u-texto-terciario"
                        >
                            Correo
                        </label>

                        <input
                            id="correo-recuperacion"
                            type="email"
                            x-model="correo"
                            placeholder="nombre@mgc.com.mx"
                            autocomplete="username"
                            :disabled="cargando"
                            autofocus
                            required
                        />
                    </div>

                    <button
                        class="boton u-boton-texto"
                        type="submit"
                        :disabled="cargando"
                    >
                        <span
                            class="boton__spinner"
                            x-show="cargando"
                            x-cloak
                        ></span>

                        <span
                            x-text="
                        cargando
                            ? 'Enviando'
                            : 'Enviar código'
                    "
                        ></span>
                    </button>

                    <div
                        class="mensaje-error"
                        role="alert"
                        aria-live="polite"
                        x-show="error"
                        x-cloak
                    >
                        <span class="mensaje-error__sello"> Rechazado </span>

                        <span x-text="error"></span>
                    </div>

                    <div class="campo__enlace campo__enlace--centrado">
                        <button type="button" class="enlace" @click="irALogin">
                            Volver a iniciar sesión
                        </button>
                    </div>
                </form>

                <!-- CONFIRMAR RECUPERACIÓN -->

                <form
                    x-show="vista === 'confirmar'"
                    x-cloak
                    @submit.prevent="confirmarRecuperacion"
                    novalidate
                >
                    <p class="nota-envio u-cuerpo u-texto-secundario">
                        Enviamos un código a
                        <strong
                            class="u-texto-primario"
                            x-text="correo"
                        ></strong
                        >.
                    </p>

                    <div class="campo">
                        <label
                            for="codigo"
                            class="u-etiqueta u-texto-terciario"
                        >
                            Código de 6 dígitos
                        </label>

                        <input
                            id="codigo"
                            type="text"
                            inputmode="numeric"
                            maxlength="6"
                            class="campo__codigo"
                            x-model="codigo"
                            placeholder="000000"
                            autocomplete="one-time-code"
                            :disabled="cargando"
                            autofocus
                            required
                        />
                    </div>

                    <div class="campo">
                        <label
                            for="password-nueva"
                            class="u-etiqueta u-texto-terciario"
                        >
                            Contraseña nueva
                        </label>

                        <div class="campo__envoltura">
                            <input
                                id="password-nueva"
                                :type="mostrarPasswordNueva ? 'text' : 'password'"
                                x-model="passwordNueva"
                                placeholder="Mínimo 8 caracteres"
                                autocomplete="new-password"
                                :disabled="cargando"
                                minlength="8"
                                required
                            />

                            <button
                                type="button"
                                class="campo__alternar"
                                tabindex="-1"
                                @click="mostrarPasswordNueva = !mostrarPasswordNueva"
                                :aria-label="
                            mostrarPasswordNueva
                                ? 'Ocultar contraseña'
                                : 'Mostrar contraseña'
                        "
                            >
                                <svg
                                    x-show="!mostrarPasswordNueva"
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                >
                                    <path
                                        d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"
                                    />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>

                                <svg
                                    x-show="mostrarPasswordNueva"
                                    x-cloak
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                >
                                    <path d="M3 3l18 18" />
                                    <path
                                        d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a13.6 13.6 0 0 1-3.4 4M6.3 6.3C3.4 8.1 1 12 1 12s4 7 11 7a10.8 10.8 0 0 0 4.2-.8"
                                    />
                                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="campo">
                        <label
                            for="password-confirmar"
                            class="u-etiqueta u-texto-terciario"
                        >
                            Confirmar contraseña
                        </label>

                        <div class="campo__envoltura">
                            <input
                                id="password-confirmar"
                                :type="mostrarPasswordConfirmar ? 'text' : 'password'"
                                x-model="passwordConfirmar"
                                placeholder="Repite la contraseña"
                                autocomplete="new-password"
                                :disabled="cargando"
                                minlength="8"
                                required
                            />

                            <button
                                type="button"
                                class="campo__alternar"
                                tabindex="-1"
                                @click="mostrarPasswordConfirmar = !mostrarPasswordConfirmar"
                                :aria-label="
                            mostrarPasswordConfirmar
                                ? 'Ocultar contraseña'
                                : 'Mostrar contraseña'
                        "
                            >
                                <svg
                                    x-show="!mostrarPasswordConfirmar"
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                >
                                    <path
                                        d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"
                                    />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>

                                <svg
                                    x-show="mostrarPasswordConfirmar"
                                    x-cloak
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                >
                                    <path d="M3 3l18 18" />
                                    <path
                                        d="M10.6 5.2A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7a13.6 13.6 0 0 0-3.4 4M6.3 6.3C3.4 8.1 1 12 1 12s4 7 11 7a10.8 10.8 0 0 0 4.2-.8"
                                    />
                                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button
                        class="boton u-boton-texto"
                        type="submit"
                        :disabled="cargando"
                    >
                        <span
                            class="boton__spinner"
                            x-show="cargando"
                            x-cloak
                        ></span>

                        <span
                            x-text="
                        cargando
                            ? 'Restableciendo'
                            : 'Restablecer contraseña'
                    "
                        ></span>
                    </button>

                    <div
                        class="mensaje-error"
                        role="alert"
                        aria-live="polite"
                        x-show="error"
                        x-cloak
                    >
                        <span class="mensaje-error__sello"> Rechazado </span>

                        <span x-text="error"></span>
                    </div>

                    <div class="campo__enlace campo__enlace--centrado">
                        <button
                            type="button"
                            class="enlace"
                            @click="irASolicitarCodigo"
                        >
                            Reenviar código
                        </button>

                        <button type="button" class="enlace" @click="irALogin">
                            Volver a iniciar sesión
                        </button>
                    </div>
                </form>

                <!-- ÉXITO -->

                <div x-show="vista === 'exito'" x-cloak class="bloque-exito">
                    <p class="u-cuerpo u-texto-primario">
                        Tu contraseña fue restablecida.
                    </p>

                    <button
                        type="button"
                        class="boton u-boton-texto"
                        @click="irALogin"
                    >
                        Iniciar sesión
                    </button>
                </div>

                <div class="pie u-mono-sm u-texto-terciario">
                    <span>MGC México</span>

                    <span x-text="fecha"></span>
                </div>
            </main>
        </div>
    </body>
</html>
