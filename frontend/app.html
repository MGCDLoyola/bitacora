<!doctype html>
<html lang="es-MX">
    <head>
        <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("tema") || "dark")</script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Bitácora</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="/static/css/tokens.css" />
        <link rel="stylesheet" href="/static/css/utilidades.css" />
        <link rel="stylesheet" href="/static/css/componentes.css" />
        <link rel="stylesheet" href="/static/css/app.css" />
        <link rel="stylesheet" href="/static/css/usuarios.css" />
        <link rel="stylesheet" href="/static/css/gestiones.css" />
        <link rel="stylesheet" href="/static/css/expediente.css" />
        <link rel="stylesheet" href="/static/css/expedientes.css" />
        <link rel="stylesheet" href="/static/css/perfil.css" />

        <script defer src="/static/js/app.js"></script>
        <script defer src="/static/js/tema.js"></script>
    </head>

    <body>

        <div id="app" class="app" hidden>
            <aside class="barra-lateral">
                <div class="barra-lateral__marca">
                    <div class="barra-lateral__nombre">Bitácora</div>

                    <div class="barra-lateral__seccion">
                        Supervisión de Cobranza Extrajudicial
                    </div>
                </div>

                <button
                    id="boton-perfil"
                    type="button"
                    class="barra-lateral__usuario"
                >
                    <div class="barra-lateral__identidad">
                        <span
                            id="usuario-nombre"
                            class="barra-lateral__usuario-nombre"
                        ></span>

                        <span
                            id="usuario-rol"
                            class="barra-lateral__usuario-rol"
                        ></span>
                    </div>
                </button>

                <nav
                    id="navegacion"
                    class="navegacion"
                    aria-label="Navegación principal"
                >
                    <!-- app.js inserta las opciones según el rol -->
                </nav>

                <div class="barra-lateral__pie">
                    <button
                        id="boton-cerrar-sesion"
                        type="button"
                        class="navegacion__item navegacion__item--accion"
                    >
                        <span class="navegacion__texto"> Cerrar sesión </span>
                    </button>

                    <button type="button" class="boton-tema boton-tema--en-linea" id="boton-tema" aria-label="Cambiar tema">
                        <svg class="boton-tema__icono boton-tema__icono--sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                        </svg>
                        <svg class="boton-tema__icono boton-tema__icono--luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
                        </svg>
                    </button>
                </div>
            </aside>

            <div class="contenido">
                <main id="contenido-principal" class="contenido__principal">
                    <!-- Las vistas se cargarán aquí -->
                </main>
            </div>
        </div>

        <div id="estado-carga" class="estado-carga" aria-live="polite">
            <span class="boton__spinner"></span>
        </div>

        <div
            id="mensaje-aplicacion"
            class="mensaje-error mensaje-aplicacion"
            role="alert"
            aria-live="polite"
            hidden
        >
            <span class="mensaje-error__sello"> Error </span>

            <span id="texto-mensaje-aplicacion"></span>
        </div>
    </body>
</html>
