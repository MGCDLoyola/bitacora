<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Bitácora · Cambiar contraseña</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/utilidades.css">
<link rel="stylesheet" href="/static/css/componentes.css">
<link rel="stylesheet" href="/static/css/cambiar-password.css">

<script defer src="/static/js/cambiar-password.js"></script>
</head>

<body>

<div class="escena">

    <div class="pestana">
        Supervisión de Cobranza Extrajudicial
    </div>

    <main class="ficha">

        <div class="marca">
            <h1 class="marca__nombre u-titulo u-texto-primario">
                Bitácora
            </h1>
        </div>

        <p class="subtitulo u-subtitulo u-texto-terciario">
            Debes establecer una nueva contraseña para continuar
        </p>

        <form id="form-cambiar-password" novalidate>

            <div class="campo">
                <label
                    for="password-nueva"
                    class="u-etiqueta u-texto-terciario"
                >
                    Contraseña nueva
                </label>

                <div class="campo__envoltura">
                    <input
                        id="password-nueva"
                        type="password"
                        name="password_nueva"
                        autocomplete="new-password"
                        placeholder="Mínimo 8 caracteres"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="campo__alternar"
                        data-toggle-password="password-nueva"
                        aria-label="Mostrar contraseña"
                    >
                        <svg
                            width="17"
                            height="17"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            aria-hidden="true"
                        >
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <p class="ayuda-password">
                    La contraseña debe tener al menos 8 caracteres.
                </p>
            </div>

            <div class="campo">
                <label
                    for="password-confirmar"
                    class="u-etiqueta u-texto-terciario"
                >
                    Confirmar contraseña
                </label>

                <div class="campo__envoltura">
                    <input
                        id="password-confirmar"
                        type="password"
                        name="password_confirmar"
                        autocomplete="new-password"
                        placeholder="Repite la contraseña"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="campo__alternar"
                        data-toggle-password="password-confirmar"
                        aria-label="Mostrar contraseña"
                    >
                        <svg
                            width="17"
                            height="17"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            aria-hidden="true"
                        >
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button
                id="boton-cambiar-password"
                class="boton u-boton-texto"
                type="submit"
            >
                <span
                    id="spinner"
                    class="boton__spinner"
                    hidden
                    aria-hidden="true"
                ></span>

                <span id="texto-boton">
                    Cambiar contraseña
                </span>
            </button>

        </form>

        <div class="pie">
            <span>MGC México</span>
            <span id="fecha"></span>
        </div>

    </main>

</div>

</body>
</html>
